name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64 Portable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Tests
        run: |
          go vet ./...
          go test -v ./internal/... ./gui/...

      - name: Build Portable ZIP
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build-portable.ps1 -Version "${{ github.ref_name }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
